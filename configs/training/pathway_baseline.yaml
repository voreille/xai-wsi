# TCGA train/validation -> CPTAC external test
#
# Fit:
#   CUDA_VISIBLE_DEVICES=0 python -m xaiwsi.training.cli fit \
#       --config configs/training/pathway_baseline.yaml
#
# Test best checkpoint:
#   python -m xaiwsi.training.cli test \
#       --config <run-dir>/config.yaml \
#       --ckpt_path <run-dir>/checkpoints/<best>.ckpt
seed_everything: 42
model:
  predictor:
    class_path: xaiwsi.models.pathway.TileMLPMean
    init_args:
      input_dim: 1536
      hidden_dim: 128
      output_dim: 50
      dropout: 0.2
      # tile_dropout: 0.25
  lr: 1.0e-4
  weight_decay: 1.0e-4
  log_per_pathway_metrics: false
  top_k_to_print: 10
data:
  tcga_rna_dir: /home/valentin/workspaces/xai-wsi/data/processed/tcga-luad/rna
  cptac_rna_dir: /home/valentin/workspaces/xai-wsi/data/processed/cptac-luad/rna
  tcga_embedding_dir: /home/valentin/workspaces/xai-wsi/data/processed/tcga-luad/wsi-embeddings/h-optimus-1
  cptac_embedding_dir: /home/valentin/workspaces/xai-wsi/data/processed/cptac-luad/wsi-embeddings/h-optimus-1
  tcga_wsi_metadata: /home/valentin/workspaces/xai-wsi/data/processed/tcga-luad/metadata/wsi_slides.csv
  cptac_wsi_metadata: /home/valentin/workspaces/xai-wsi/data/processed/cptac-luad/metadata/wsi_slides.csv
  hallmark_gmt: /home/valentin/workspaces/xai-wsi/data/external/msigdb/h.all.v2026.1.Hs.symbols.gmt
  val_fraction: 0.2
  split_seed: 42
  # Variable tile counts per WSI: keep one WSI per batch for now.
  batch_size: 1
  num_workers: 8
  pin_memory: true
trainer:
  accelerator: auto
  devices: 1
  max_epochs: 30
  precision: 32-true
  # Lightning/W&B local run root. With ModelCheckpoint.dirpath unset,
  # Lightning stores checkpoints under the logger/run directory.
  default_root_dir: /home/valentin/workspaces/xai-wsi/runs/pathways
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: xai-wsi
      name: hallmark-tile-mlp-mean
      save_dir: /home/valentin/workspaces/xai-wsi/runs/pathways
      log_model: false
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/median_spearman
        mode: max
        save_top_k: 1
        save_last: true
        filename: "epoch={epoch:02d}-step={step}"
        auto_insert_metric_name: false
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/median_spearman
        mode: max
        patience: 5
        min_delta: 0.0
  log_every_n_steps: 20
  enable_progress_bar: true
  enable_model_summary: true
