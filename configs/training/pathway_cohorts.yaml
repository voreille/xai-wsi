# Multi-cohort WSI -> Hallmarks: train/val on TCGA-LUAD + TCGA-LUSC (+ TCGA-BRCA as a
# far cohort), external test on CPTAC-LUAD (and CPTAC-LSCC once its RNA is processed).
# Without data.init_args.use_train_cohorts all listed training cohorts are used; select a
# subset, optionally capped, with e.g. --data.init_args.use_train_cohorts
# '[tcga-luad,tcga-brca:381]' (scripts/pathway_cohorts.sh always sets it).
#
# Each training cohort is split train/val with the same seed (the TCGA-LUAD split is the
# one of pathway_baseline.yaml). With target_normalization: per_cohort, gene z-score
# statistics are fit on each cohort's training split, so targets are relative to the
# cohort; test cohorts use their zscore_reference cohort's statistics. Validation logs
# val/<metric> over all cohorts and val/<cohort>/<metric> per cohort; checkpoints are
# selected on TCGA-LUAD val, so LUAD-only and LUAD+LUSC runs are comparable.
#
# LUAD-only run with the same config:
#   --data.init_args.train_cohorts '[{name: tcga-luad, slides_root_dir: /mnt/nas7/data/TCGA_Lung_svs}]'
# (see scripts/pathway_cohorts.sh).
#
# Fit:
#   CUDA_VISIBLE_DEVICES=0 python -m xaiwsi.training.cli fit \
#       --config configs/training/pathway_cohorts.yaml
#
# Test best checkpoint (writes <run-dir>/test_metrics.json):
#   python -m xaiwsi.training.cli test \
#       --config <run-dir>/config.yaml \
#       --ckpt_path <run-dir>/checkpoints/<best>.ckpt
seed_everything: 42
model:
  predictor:
    class_path: xaiwsi.models.pathway.TileMLPMean
    init_args:
      input_dim: 1536
      hidden_dim: 128
      output_dim: 50
      dropout: 0.2
      # tile_dropout: 0.25
  lr: 1.0e-4
  weight_decay: 1.0e-4
  log_per_pathway_metrics: false
  top_k_to_print: 10
data:
  class_path: xaiwsi.training.pathway_datamodule.CohortPathwayDataModule
  init_args:
    processed_root: /home/valentin/workspaces/xai-wsi/data/processed
    embedding: h-optimus-1-fp16
    train_cohorts:
      - name: tcga-luad
        slides_root_dir: /mnt/nas7/data/TCGA_Lung_svs
      - name: tcga-lusc
        slides_root_dir: /mnt/nas7/data/TCGA_Lung_svs/LUSC
      - name: tcga-brca
        slides_root_dir: /mnt/nas7/data/TCGA/TCGA_Breast
    test_cohorts:
      - name: cptac-luad
        slides_root_dir: /mnt/nas6/data/CPTAC/CPTAC-LUAD_v12/LUAD
        zscore_reference: tcga-luad
      - name: cptac-lusc
        slides_root_dir: /mnt/nas6/data/CPTAC/CPTAC-LSCC_v10/LSCC
        zscore_reference: tcga-lusc
    target_normalization: per_cohort
    hallmark_gmt: /home/valentin/workspaces/xai-wsi/data/external/msigdb/h.all.v2026.1.Hs.symbols.gmt
    val_fraction: 0.2
    split_seed: 42
    # Variable tile counts per WSI: keep one WSI per batch for now.
    batch_size: 1
    num_workers: 8
    pin_memory: true
trainer:
  accelerator: auto
  devices: 1
  max_epochs: 30
  precision: 32-true
  # Lightning/W&B local run root. With ModelCheckpoint.dirpath unset,
  # Lightning stores checkpoints under the logger/run directory.
  default_root_dir: /home/valentin/workspaces/xai-wsi/runs/pathways
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: xai-wsi
      name: hallmark-tile-mlp-mean-cohorts
      save_dir: /home/valentin/workspaces/xai-wsi/runs/pathways
      log_model: false
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/tcga-luad/median_spearman
        mode: max
        save_top_k: 1
        save_last: true
        filename: "epoch={epoch:02d}-step={step}"
        auto_insert_metric_name: false
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/tcga-luad/median_spearman
        mode: max
        patience: 5
        min_delta: 0.0
  log_every_n_steps: 20
  enable_progress_bar: true
  enable_model_summary: true
