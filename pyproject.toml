[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xai-wsi"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.13",
  "torchvision",
  "pillow>=10.0",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["xaiwsi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
