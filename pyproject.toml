[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xai-wsi"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.13",
  "torchvision",
  "pillow>=10.0",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "tqdm>=4.66",
  "pandas",
  "pyarrow",
  "scipy",
  "pyyaml",
  "requests",
  "click",
  "rnanorm",
  "gseapy",
  "openslide-python",
  "openslide-bin",
  "lightning",
  "jsonargparse[signatures]",
  "wandb",
  "wsitools[embed]",  # ../wsi-tools; [embed] for wsi-embed (timm)
  "torch-geometric",  # BulkFormer GCN; no torch-sparse/scatter needed
  "performer-pytorch==1.1.4",  # BulkFormer; pinned to the upstream version (state_dict layout)
  "openpyxl",  # TCGA-CDR clinical table (.xlsx)
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.uv.sources]
wsitools = { path = "../wsi-tools", editable = true }
# PyPI torch is built for CUDA 13; the GPU servers' driver supports CUDA <= 12.9.
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.setuptools.packages.find]
where = ["."]
include = ["xaiwsi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
